[project]
name = "acrresolv"
version = "1.0.0"
description = "Hybrid acronym resolver with ML, rules, and lookup"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Emiliano Gandini Outeda", email = "emiliano.gandini@protonmail.com" }
]
license = "MIT"
keywords = [
  "python",
  "text",
  "acronyms",
  "nlp",
  "abbreviation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "cleantext>=1.1.4",
    "pydantic>=2.13.4",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "sentencepiece>=0.1.99",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/emiliano-go/acrresolv"
Issues = "https://github.com/emiliano-go/acrresolv/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acrresolv"]
